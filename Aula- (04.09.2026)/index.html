<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Cartão de Personagem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 🎮 Bem-vindo(a)! Você vai criar o CARTÃO DE PERSONAGEM do seu jogo. -->
  <!-- Todo mundo começa com o mesmo HTML, mas o CSS de cada um vai ficar diferente. Solte a criatividade! -->

  <main class="cartao" id="cartao-personagem">

    <div class="avatar">
      <img src="https://i.pinimg.com/736x/b4/9c/94/b49c94e3e6de9a6c3abafd034bae3d46.jpg" alt="...">
    </div>

    <h1 class="nome">Lanbida</h1>
    <p class="classe">Classe: Mago traiçoeiro</p>

    <div class="nivel">
      <span>Nível 100</span>
    </div>

    <div class="barra-fundo">
      <div class="barra-vida"></div>
    </div>

    <div class="barra-fundo">
      <div class="barra-xp"></div>
    </div>

    <ul class="atributos">
      <li class="atributo">⚔️ Força: 10000000000 </li>
      <li class="atributo">🛡️ Defesa: 10000000000 </li>
      <li class="atributo">💨 Velocidade: 10000000000</li>
    </ul>

    <p class="descricao">
      Ele é um mago traiçoeiro, sempre que tem a oportunidade de roubar ele rouba.
    </p>

    <button class="botao-acao">ATACAR!</button>

  </main>

</body>
</html>
