<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Catálogo de Produtos</h1>
    </header>
    <main class="container">
        <div class="card">
            <img src="./images/galaxy.png" alt="Produto" class="img">
            <h2 class="Produto">Produto 1</h2>
            <p class="p">Descrição breve do produto.</p>
            <span class="span"><strong>R$ 99,90</strong></span>
            <button class="botao">Comprar</button>
        </div>
        <div class="card">
            <img src="./images/iphone.png" alt="Produto" class="img">
            <h2 class="Produto">Produto 2</h2>
            <p class="p">Descrição breve do produto.</p>
            <span class="span"><strong>R$ 149,90</strong></span>
            <button class="botao">Comprar</button>
        </div>
        <div class="card">
            <img src="./images/redmi.png" alt="Produto" class="img">
            <h2 class="Produto">Produto 3</h2>
            <p class="p">Descrição breve do produto.</p>
            <span class="span"><strong>R$ 199,90</strong></span>
            <button class="botao">Comprar</button>
        </div>
        <div class="card">
            <img src="./images/motorola.png" alt="Produto" class="img">
            <h2 class="Produto">Produto 4</h2>
            <p class="p">Descrição breve do produto.</p>
            <span class="span"><strong>$ 249,90</strong></span>
            <button class="botao">Comprar</button>
        </div>
    </main>
</body>
</html>
